<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sieve</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main id="root">
      <header class="panel-header">
        <h1>Sieve</h1>
      </header>
      <section id="settings" class="panel-section" aria-label="Site settings"></section>
      <section id="llm-settings" class="panel-section" aria-label="LLM provider"></section>
      <section id="page-status" class="panel-section" aria-label="Page status"></section>
      <section id="error-panel" class="panel-section" aria-label="Errors"></section>
      <section id="filter-list" class="panel-section" aria-label="Filters"></section>
      <section id="numeric-filter" class="panel-section" aria-label="Numeric filter"></section>
      <section id="deep-toggle" class="panel-section" aria-label="Deep scan"></section>
      <section id="hidden-list" class="panel-section" aria-label="Hidden items"></section>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
